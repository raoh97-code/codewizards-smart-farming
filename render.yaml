services:
  - type: web
    name: codewizards-smart-farming
    runtime: python
    rootDir: backend
    buildCommand: apt-get install -y wkhtmltopdf && pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DATABASE_NAME
        sync: false
    healthCheckPath: /
